<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        label {
            font-size: 16px;
            margin: 10px 0 5px;
            display: block;
        }

        input {
            width: 100%;
            padding: 8px;
            font-size: 16px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #result {
            margin-top: 20px;
            display: none;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>BMI Calculator</h1>
        <form id="bmi-form">
            <label for="weight">Weight (kg):</label>
            <input type="number" id="weight" placeholder="Enter weight in kg" required>

            <label for="height">Height (cm):</label>
            <input type="number" id="height" placeholder="Enter height in cm" required>

            <button type="submit">Calculate BMI</button>
        </form>

        <div id="result">
            <h2>Your BMI: <span id="bmi"></span></h2>
            <p id="bmi-category"></p>
        </div>
    </div>



    <script>


        document.getElementById('bmi-form').addEventListener("submit", function (e) {
            e.preventDefault();

            const weight = parseInt(document.getElementById('weight').value)
            const height = parseInt(document.querySelector('#height').value)

            console.log(weight);
            console.log(height);


            if (height === '' || height <= 0) {
                alert(`Please Enter the correct Number,  ${height}`)
            } else if (weight === '' || weight <= 0) {
                alert(`Please Enter the correct Number,  ${weight}`)
            } else {
                const bmiValue = (weight / ((height / 100) * (height / 100))).toFixed(2);                document.getElementById('bmi').innerHTML = bmiValue
                console.log(bmiValue);
                document.getElementById("result").style.display = "block"
            }
        })

        function getCotegory(bmiValue){
            if(bmi<18.5){
                return 'Under Weight'
            }else if(bmi>= 18.5 && bmi<24.9){
                return 'Normal Weight'
            }else if(bmi>= 24.9 && bmi<29.9){
                return 'Normal Weight'
            }else{
                return "Obesity";
            }
        }
        const bmiCategory=document.getElementById('bmi-category').innerText=getCotegory()

    </script>


</body>

</html>
