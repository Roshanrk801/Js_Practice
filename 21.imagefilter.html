<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Searching</title>
<style>


body {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
.main {
    width: 100%;
    height: 100%;
    background-color: #ccb0b0;
}

.container {
    padding: 10vw 25vw;

}

input {
    width: 100%;
    padding: 12px 22px;
    font-size: 25px;
    font-weight: 700;
    border-radius: 10px;
    border: 1px solid #ccb0b0;
    outline-color: royalblue;
}

.people{
    margin-top: 20px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;

}
.person {
    width: fit-content;
    display: flex;
    flex-direction: column;
    align-items: center;

}

.img {
    border-radius: 50%;
    width: 7vw;
    height: 7vw;
    border: 2px solid #d4afaf;
    overflow: hidden;
}

.img img{
    width: 100%;
    height: 100%;
    object-fit: cover;

}
</style></head>

<body>
    <div class="main">
        <div class="container">
            <input type="text">
            <div class="people">
                
               
                
               
            </div>
        </div>
    </div>

<script>
    
let input = document.querySelector("input")

let data = [
    {
        name: "harsh", src: "https://plus.unsplash.com/premium_photo-1678197937465-bdbc4ed95815?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8cGVyc29ufGVufDB8fDB8fHww"
    },
    {
        name: "ankit", src: "https://plus.unsplash.com/premium_photo-1689539137236-b68e436248de?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8cGVyc29ufGVufDB8fDB8fHww"
    },
    {
        name: "akash", src: "https://plus.unsplash.com/premium_photo-1689977927774-401b12d137d6?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTd8fHBlcnNvbnxlbnwwfHwwfHx8MA%3D%3D"
    },
    {
        name: "rubi", src: "https://images.unsplash.com/photo-1521566652839-697aa473761a?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTB8fHBlcnNvbnxlbnwwfHwwfHx8MA%3D%3D"
    },
]
let pers = "";
data.forEach(function (elem) {
    pers += `<div class="person">
            <div class="img">
                <img src="${elem.src}"
                    alt="">
            </div>
                <h3>${elem.name}</h3>
            </div>`
})

document.querySelector(".people").innerHTML = pers;

input.addEventListener("input", function () {
    let matching = data.filter(function (e) {
        return e.name.startsWith(input.value)
    })
    let newUser = "";
    matching.forEach(function (elem) {
        newUser += `<div class="person">
            <div class="img">
                <img src="${elem.src}"
                    alt="">
            </div>
                <h3>${elem.name}</h3>
            </div>`
    })

    document.querySelector(".people").innerHTML = newUser;
})
</script></body>

</html>
