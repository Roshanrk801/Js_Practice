<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator hk</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f2f2f2;
            font-family: "Helvetica", sans-serif;
        }

        .container {
            background-color: white;
            max-width: 600px;
            margin: 100px auto;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin: 10px 0;
            width: 100%;
        }

        button {
            background-color: #4caf50;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
            font-size: 18px;
            text-transform: uppercase;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #45a049;
        }

        #total {
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>

<body cz-shortcut-listen="true">
    <div class="container">
        <h1>Tip Calculator</h1>
        <p>Enter the bill amount and tip percentage to calculate the total.</p>
        <label for="bill">Bill amount:</label>
        <input type="number" id="bill">
        <br>
        <label for="tip">Tip percentage:</label>
        <input type="number" id="tip">
        <br>
        <button id="calculate">Calculate</button>
        <br>
        <label for="total">Total:</label>
        <span id="total"></span>

    </div>

    <script>

        const billEl = document.querySelector("#bill")
        const tipEl = document.querySelector("#tip")
        const calculateBtn = document.querySelector("#calculate")
        const totalEl = document.querySelector("#total")

        function calculateTotal(tipAmount, billAmount) {
            let tipCalc = (tipAmount / billAmount) * 100
            let totalBill = (billAmount + tipCalc);
            console.log(totalBill)
            return totalBill
        }
        //    calculateTotal()

        calculateBtn.addEventListener('click', (e) => {
            e.preventDefault

            const billAmount = parseInt(billEl.value);
            const tipAmount = parseInt(tipEl.value);
            console.log(billAmount, tipAmount)
            const totalBillSpan = calculateTotal(tipAmount, billAmount)

            if (isNaN(billAmount) || isNaN(tipAmount) || billAmount && tipAmount === "" || tipAmount < 0 || billAmount < 0) {
                alert("Enter valid Number")
            } else {

                totalEl.innerText = totalBillSpan.toFixed(2);
            }
        })

    </script>
</body>

</html>
