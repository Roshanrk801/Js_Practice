<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>recipe-book-app</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background: #0c2461;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 36px;
    }

    .container {
      margin: 0 auto;
      max-width: 1200px;
      padding: 20px;
    }

    .recipe-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .recipe-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      border-radius: 5px;
      overflow: hidden;
    }

    .recipe-item img {
      width: 150px;
      height: 150px;
      object-fit: cover;
    }

    .recipe-item h2 {
      margin: 0;
      font-size: 20px;
      padding: 10px;
      min-width: 200px;
    }

    .recipe-item p {
      margin: 0;
      padding: 10px;
      color: #777;
    }

    .recipe-item a {
      background: #0c2461;
      color: #fff;
      min-width: 150px;
      padding: 10px;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 14px;
      transition: background 0.3s ease;
    }

    .recipe-item a:hover {
      background: #1e3799;
    }

    @media screen and (max-width: 768px) {
      .container {
        max-width: 90%;
      }

      .recipe-item {
        flex-direction: column;
      }

      .recipe-item img {
        width: 100%;
        height: auto;
        margin-bottom: 10px;
      }

      .recipe-item h2 {
        font-size: 20px;
        padding: 0;
        margin-bottom: 10px;
      }

      .recipe-item p {
        font-size: 14px;
        margin-bottom: 10px;
      }

      .recipe-item a {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Recipe Book App</h1>
  </header>

  <div class="container">
    <ul id="recipe-list" class="recipe-list">
      <!-- <li class="recipe-item">
        <img src="https://spoonacular.com/recipeImages/12345-312x231.jpg" alt="Recipe 1" />

      </li>

        <p>

        <a href="#">View Recipe</a>
      </li> -->
    </ul>
  </div>
  <script>

    const API_KEY = "275d58779ccf4e22af03e792e8819fff";
    const recipeList = document.querySelector("#recipe-list");

    function displayRecipes(recipes) {
      recipeList.innerHTML = "";
      recipes.forEach((recipe) => {
        recipeItemLi = document.createElement('li')
        recipeItemLi.classList.add("recipe-item")
        recipeImg = document.createElement('img');
        recipeImg.src = recipe.image;
        recipeImg.alt = "recipe img";
        viewBtn = document.createElement('a');
        viewBtn.href = recipe.sourceUrl;
        viewBtn.innerText = "View Recipe";
        recipeTitle = document.createElement("h2");
        recipeTitle.innerHTML = recipe.title
        recipeIngredientEl = document.createElement('p');
        recipeIngredientEl.innerHTML = `<strong>Ingredients</strong>${recipe.extendedIngredients.map(ingredient => ingredient.original).join(", ")}`

        recipeList.append(recipeItemLi)
        recipeItemLi.append(recipeImg)
        recipeItemLi.append(recipeTitle)
        recipeItemLi.append(recipeIngredientEl)
        recipeItemLi.append(viewBtn)
      });
    }

    async function getRecipes() {
      try {
        const response = await fetch(`https://api.spoonacular.com/recipes/random?number=10&apiKey=${API_KEY}`);
        if (!response.ok) {
          throw new Error("Failed to fetch recipes");
        }
        const data = await response.json();
        return data.recipes;
      } catch (error) {
        console.error("Error fetching recipes:", error);
        return [];
      }
    }

    async function init() {
      const recipes = await getRecipes();
      displayRecipes(recipes);
    }
    init();

  </script>
</body>

</html>
