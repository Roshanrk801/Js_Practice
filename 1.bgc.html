<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Background Color</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <h1>Change Background Color</h1>
    <button onclick="changeBackgroundColor('lightblue')">Light Blue</button>
    <button onclick="changeBackgroundColor('lightgreen')">Light Green</button>
    <button onclick="changeBackgroundColor('lightcoral')">Light Coral</button>
    <button onclick="changeBackgroundColor('white')">Reset to White</button>

    <script>

        // const body = document.querySelector("body")   //this is also correct
        function changeBackgroundColor(color) {
           document.body.style.backgroundColor = color
        }
    </script>
</body>

</html>
