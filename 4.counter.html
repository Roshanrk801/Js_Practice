<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Counter | DOM Projects</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Raleway', Fallback, sans-serif;
            font-size: 16px;
        }

        body {
            display: flex;
            height: 100vh;
            margin: 0 20;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fc;
        }

        main {
            text-align: center;
        }

        main h2 {
            font-size: 50px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        main h1 {
            font-size: 48px;
            font-weight: 600;
            margin-bottom: 10px;
            display: inline-block;
            padding: 20px;
            border-radius: 2px;
            background-color: rgba(139, 236, 183, 0.5);
        }

        .btn-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-area .btn {
            font-size: 1.8em;
            height: 100%;
            width: 100%;
            padding: 5px 30px;
            margin: 0 10px;
            border: none;
            background: rgba(46, 59, 230, 0.781);
            color: white;
            border-radius: 3px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body cz-shortcut-listen="true">
    <main>
        <h2>Counter</h2>
        <h1 id="counter-value">0</h1>
        <section class="btn-area">
            <button class="btn decrease">-</button>
            <button class="btn reset">↻</button>
            <button class="btn increase">+</button>
        </section>
    </main>

    <script>
        const counterValue = document.querySelector("#counter-value");
        const btnAll = document.querySelectorAll(".btn");

        let counter = 0;

        function updateCounter() {
            counterValue.textContent = counter;
        }
        updateCounter()

        btnAll.forEach((btn) => {
            btn.addEventListener("click", function (e) {
                const btnCount = e.target.classList;

                let count = Number(counterValue.innerText);
                if (btnCount.contains("decrease")) {
                    counter--;
                    updateCounter()
                } else if (btnCount.contains("increase")) {
                    counter++;
                    updateCounter()
                } else if (btnCount.contains("reset")) {
                    counter = 0
                    updateCounter()
                }
                colorChange()
            });
        });

        function colorChange(){
            if (counter > 0) {
                    counterValue.style.color = "green"
                    counterValue.style.background = "#99e995"
                }else if (counter < 0) {
                    counterValue.style.color = "red"
                    counterValue.style.background = "#e79292"
                }else{
                    counterValue.style.color="black"
                    counterValue.style.background="#5e6265"
                }
        }
    </script>

</body>

</html>
