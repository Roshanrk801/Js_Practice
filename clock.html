<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #282c34;
            color: white;
            font-family: 'Arial', sans-serif;
        }

        .clock {
            font-size: 60px;
            padding: 20px;
            border: 5px solid #61dafb;
            border-radius: 10px;
            background-color: #20232a;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .flex {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="flex">
        <h1>Digital Clock</h1>
        <div class="clock" id="clock">
            00:00:00
        </div>
    </div>

    <script>


        setInterval(function(){
            const now = new Date();
            const clock = document.querySelector(".clock").innerHTML=now.toLocaleTimeString()

        },1000)


    </script>
</body>

</html>
