<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temperature Converter hk</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(to left bottom, lightgreen, lightblue);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: monospace;
      color: darkcyan;
    }

    .container {
      background: rgba(255, 255, 255, 0.3);
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      width: 85%;
      max-width: 450px;
      min-width: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .heading {
      font-size: 32px;
    }

    .temp-container {
      width: 100%;
      padding: 15px;
      font-weight: bold;
      font-size: 18px;
    }

    .input {
      width: 220px;
      font-family: monospace;
      padding: 5px;
      float: right;
      outline: none;
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.5);
      color: darkgreen;
      font-size: 18px;
    }


    .input::placeholder {
      color: darkgray;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 class="heading">Temperature Converter</h1>
    <div class="temp-container">
      <label for="celsius">Celsius:</label>
      <input onchange="computeTemp(event)" type="number" name="celsius" id="celsius" placeholder="Enter Temperature"
        class="input" />
    </div>
    <div class="temp-container">
      <label for="fahrenheit">Fahrenheit:</label>
      <input onchange="computeTemp(event)" type="number" name="fahrenheit" id="fahrenheit"
        placeholder="Enter Temperature" class="input" />
    </div>
    <div class="temp-container">
      <label for="kelvin">Kelvin:</label>
      <input onchange="computeTemp(event)" type="number" name="kelvin" id="kelvin" placeholder="Enter Temperature"
        class="input" />
    </div>
  </div>

</body>

</html>
